[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; The sketch and config.h are kept at the project root to match Arduino IDE.
build_src_filter = +<Songhub-ESP32.ino>

lib_deps =
  chris--a/Keypad@^3.1.1
  https://github.com/T-vK/ESP32-BLE-Keyboard.git

monitor_speed = 115200
upload_speed = 921600

